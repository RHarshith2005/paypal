# Local Postgres for Handshake. Optional: the API falls back to embedded PGlite
# when DATABASE_URL is unset, so `pnpm dev` works without Docker.
services:
  postgres:
    image: postgres:17-alpine
    container_name: handshake-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handshake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handshake}
      POSTGRES_DB: ${POSTGRES_DB:-handshake}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handshake} -d ${POSTGRES_DB:-handshake}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - handshake-pgdata:/var/lib/postgresql/data

volumes:
  handshake-pgdata:
